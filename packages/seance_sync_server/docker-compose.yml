# Séance sync server. Build from the repo root:
#   docker compose -f packages/seance_sync_server/docker-compose.yml up -d --build
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front for
# production. Flip SEANCE_OPEN_REGISTRATION=true only long enough to enrol your
# own devices, then set it back to false and restart.
services:
  seance-sync:
    build:
      context: ../..
      dockerfile: packages/seance_sync_server/Dockerfile
    image: seance-sync:latest
    restart: unless-stopped
    ports:
      # Plain HTTP is intended to sit behind a local TLS reverse proxy. By
      # default the host port binds to loopback so compose does not expose it
      # on every interface. If your reverse proxy runs in a container (Nginx
      # Proxy Manager, Traefik, …), loopback is NOT reachable from it — set
      # SEANCE_PUBLISH_ADDR in packages/seance_sync_server/.env (gitignored,
      # survives updates; see .env.example): 172.17.0.1 publishes only on the
      # Docker bridge gateway, 0.0.0.0 on every interface (firewall it).
      - "${SEANCE_PUBLISH_ADDR:-127.0.0.1}:8787:8787"
    environment:
      SEANCE_BIND: "0.0.0.0"
      SEANCE_PORT: "8787"
      SEANCE_DB_PATH: "/data/seance.sqlite"
      SEANCE_OPEN_REGISTRATION: "false"
      SEANCE_LOGIN_MAX_ATTEMPTS: "10"
      SEANCE_LOGIN_WINDOW_SECONDS: "60"
    volumes:
      - seance-data:/data
    healthcheck:
      # A real liveness probe against /healthz (the slim image has no curl or
      # wget; bash's /dev/tcp does the job — bash is an essential package in
      # debian:*-slim, so it is always present; revisit this probe if the
      # Dockerfile ever moves to alpine/distroless). Matching ' 200 ' on the
      # status line only, so a body or date header can never false-positive.
      # The old `seance-sync --help` check only proved the binary could
      # execute, so a wedged server still showed "healthy".
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8787 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  seance-data:
